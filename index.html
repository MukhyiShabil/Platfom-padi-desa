<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Padi Desa</title>
    <script>
        // Redirect otomatis ke dashboard jika sudah login, atau login.html jika belum
        const token = localStorage.getItem('accessToken');
        const user = localStorage.getItem('user');

        if (token && user) {
            window.location.replace('pages/dashboard.html');
        } else {
            window.location.replace('pages/login.html');
        }
    </script>
</head>
<body style="background:#0a0f1e; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
    <div style="text-align:center;">
        <div style="font-size:48px; margin-bottom:12px;">🌾</div>
        <h2 style="font-size:20px; font-weight:700;">Platform Padi Desa</h2>
        <p style="color:rgba(255,255,255,0.4); font-size:14px; margin-top:8px;">Mengalihkan ke aplikasi...</p>
    </div>
</body>
</html>
